<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>three-map-terrain playground</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #222;
      }
      #info,
      #credits {
        position: fixed;
        left: 8px;
        color: #ddd;
        font:
          12px/1.4 ui-monospace,
          monospace;
      }
      #info {
        top: 8px;
      }
      #credits {
        bottom: 8px;
        color: #999;
      }
    </style>
  </head>
  <body>
    <!--
      Query params:
        renderer=webgl|webgpu  forceWebGL=1  lights=0|1  wireframe=1  nTiles=N  grid=W,N,E,S  segments=N  view=orbit|top
        api=eox|osm|swisstopo|none  elevation=aws|mapterhorn|…  buildings=openfreemap|versatiles|overpass|…  edges=1
        roads=…  water=…  vegetation=…  (openfreemap|versatiles|overpass|…)  color=e9e4da  gray=1  token=…  (for mapbox, maptiler, protomaps)
        zoom=N  lat=…  lon=…  exaggeration=1  base=…  (other than the Alps at zoom 11: true scale; base altitude)
    -->
    <div id="info"></div>
    <div id="credits"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
