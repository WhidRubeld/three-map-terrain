name: Publish Package to npmjs

on:
  release:
    # `published` also covers releases that start as a draft (`created` does not)
    types: [published]
  # retry a failed publish without recreating the release
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # setup-node writes an .npmrc that references ${NODE_AUTH_TOKEN}, and
      # Yarn 1 aborts on an unset variable. Only `npm publish` gets the token.
      NODE_AUTH_TOKEN: unused
    steps:
      - uses: actions/checkout@v7
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          registry-url: 'https://registry.npmjs.org'
      - run: yarn install --frozen-lockfile
      - run: yarn validate
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
