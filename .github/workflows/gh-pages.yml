name: Build and GH-Page Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            examples/gpx-viewer/yarn.lock

      - name: Build package
        run: |
          yarn install --frozen-lockfile
          yarn build

      # the GPX viewer is the live demo; examples/basic is built by CI only
      - name: Build project
        working-directory: examples/gpx-viewer
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: examples/gpx-viewer/dist
